# Mise en ligne automatique à chaque push sur main :
#   1) règles de la base (database.rules.json) — testées sur l'émulateur AVANT d'être publiées
#   2) site sur https://dereh-halev.web.app — seulement si les règles sont passées
# Secret requis : FIREBASE_SERVICE_ACCOUNT (clé JSON d'un compte de service du projet dereh-halev).
# Ce compte de service doit avoir le rôle « Firebase Realtime Database Admin » pour publier les règles.
name: Déploiement Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # pas de package-lock.json dans le dépôt (.gitignore) → npm install, pas npm ci
      - run: npm install --no-audit --no-fund
      # Garde-fou : des règles qui cassent un test ne sont jamais publiées
      - run: npm test
      - run: npm run test:rules
      - name: Publier les règles de la base
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only database --project dereh-halev --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

  deploy:
    needs: rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Seuls les fichiers du site sont publiés (pas les tests, règles, docs…)
      - run: |
          mkdir -p public
          cp index.html admin.html i18n.js commun.js matching.js stats.js admin-stats.js style.css logo.png logo-heart.png apple-touch-icon.png public/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: dereh-halev
