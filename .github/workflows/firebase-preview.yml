# Aperçu d'essai : chaque pull request vers main est publiée sur une adresse
# temporaire (canal de prévisualisation Firebase Hosting, expire au bout de 14 jours),
# SANS toucher au site https://dereh-halev.web.app.
# La base est la même que la production : les règles de la PR sont testées puis
# publiées (elles doivent rester compatibles avec le site principal).
# Retour en arrière : fermer la PR, puis relancer « Déploiement Firebase Hosting »
# sur main (Actions → Run workflow) pour republier les règles de main.
name: Aperçu d'essai (PR)
on:
  pull_request:
    branches: [main]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:rules
      - name: Publier les règles de la base
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only database --project dereh-halev --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

  preview:
    needs: rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public
          cp index.html admin.html i18n.js commun.js matching.js photos.js stats.js admin-stats.js style.css logo.png logo-heart.png apple-touch-icon.png public/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dereh-halev
          expires: 14d
